name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  backend-tests:
    name: Backend tests (all 3 queue drivers)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # src/.env is gitignored (correctly — it's local config, not something
      # to commit), so a fresh checkout has none and docker-compose.yml's
      # env_file: references fail immediately. Seed it from .env.example,
      # same as the composer "setup" script does for local dev, and give it
      # a real APP_KEY so `php artisan serve` (the app container's default
      # command) doesn't choke on a blank one; composer test overrides
      # APP_KEY via phpunit.xml regardless, so this key is only for the
      # container staying up.
      - name: Prepare .env
        run: |
          cp src/.env.example src/.env
          sed -i 's/^APP_KEY=$/APP_KEY=base64:7Gc2EggY5Brueduj1LvhoPtt1iocQU+g9NNTymB5njo=/' src/.env

      # `app` depends_on mysql/redis with condition: service_healthy, so this
      # one command also starts and waits on both — same stack as local dev,
      # not a separate CI-only setup.
      - name: Start the app stack
        run: docker compose up -d --build app

      - name: Wait for vendor/ to be in place
        run: |
          for i in $(seq 1 30); do
            if docker compose exec -T app test -f vendor/autoload.php; then
              exit 0
            fi
            sleep 1
          done
          echo "vendor/autoload.php never appeared" >&2
          exit 1

      - name: composer test
        run: docker compose exec -T app composer test

      - name: Show container logs on failure
        if: failure()
        run: docker compose logs

  frontend:
    name: Frontend build + lint
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - run: npm ci
      - run: npm run build
      - run: npm run lint

services:
  app:
    build: .
    working_dir: /var/www/html
    volumes:
      - ./src:/var/www/html
      - vendor:/var/www/html/vendor
    ports:
      - "8010:8000"
    command: php artisan serve --host=0.0.0.0 --port=8000
    env_file:
      - ./src/.env
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy

  worker-1:
    build: .
    working_dir: /var/www/html
    volumes:
      - ./src:/var/www/html
      - vendor:/var/www/html/vendor
    command: php artisan jobs:work --worker-id=worker-1 --timeout=120
    env_file:
      - ./src/.env
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy

  worker-2:
    build: .
    working_dir: /var/www/html
    volumes:
      - ./src:/var/www/html
      - vendor:/var/www/html/vendor
    command: php artisan jobs:work --worker-id=worker-2 --timeout=120
    env_file:
      - ./src/.env
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy

  worker-3:
    build: .
    working_dir: /var/www/html
    volumes:
      - ./src:/var/www/html
      - vendor:/var/www/html/vendor
    command: php artisan jobs:work --worker-id=worker-3 --timeout=120
    env_file:
      - ./src/.env
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy

  mysql:
    image: mysql:8.0
    environment:
      MYSQL_DATABASE: jobs_db
      MYSQL_ROOT_PASSWORD: root
    # Host-side port only, for connecting an external client — app/workers
    # reach this over the compose network as `mysql:3306` either way. Not
    # 3306 on the host: GitHub Actions' ubuntu-latest runners ship with
    # their own MySQL already bound to it, which fails `docker compose up`
    # with "port is already allocated" before a single container starts.
    ports:
      - "13306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
      - ./docker/mysql/init-test-db.sql:/docker-entrypoint-initdb.d/init-test-db.sql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-uroot", "-proot"]
      interval: 5s
      timeout: 5s
      retries: 20

  redis:
    image: redis:7-alpine
    # Same reasoning as mysql's port above: host-side convenience only.
    ports:
      - "16379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20

  adminer:
    image: adminer
    ports:
      - "8080:8080"
    depends_on:
      - mysql

volumes:
  mysql_data:
  vendor:

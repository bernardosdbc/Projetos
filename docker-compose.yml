services:
  app:
    build: .
    working_dir: /var/www/html
    volumes:
      - ./src:/var/www/html
      - vendor:/var/www/html/vendor
    ports:
      - "8010:8000"
    command: php artisan serve --host=0.0.0.0 --port=8000
    env_file:
      - ./src/.env
    depends_on:
      mysql:
        condition: service_healthy

  worker-1:
    build: .
    working_dir: /var/www/html
    volumes:
      - ./src:/var/www/html
      - vendor:/var/www/html/vendor
    command: php artisan jobs:work --worker-id=worker-1 --timeout=120
    env_file:
      - ./src/.env
    depends_on:
      mysql:
        condition: service_healthy

  worker-2:
    build: .
    working_dir: /var/www/html
    volumes:
      - ./src:/var/www/html
      - vendor:/var/www/html/vendor
    command: php artisan jobs:work --worker-id=worker-2 --timeout=120
    env_file:
      - ./src/.env
    depends_on:
      mysql:
        condition: service_healthy

  worker-3:
    build: .
    working_dir: /var/www/html
    volumes:
      - ./src:/var/www/html
      - vendor:/var/www/html/vendor
    command: php artisan jobs:work --worker-id=worker-3 --timeout=120
    env_file:
      - ./src/.env
    depends_on:
      mysql:
        condition: service_healthy

  mysql:
    image: mysql:8.0
    environment:
      MYSQL_DATABASE: jobs_db
      MYSQL_ROOT_PASSWORD: root
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-uroot", "-proot"]
      interval: 5s
      timeout: 5s
      retries: 20

  adminer:
    image: adminer
    ports:
      - "8080:8080"
    depends_on:
      - mysql

volumes:
  mysql_data:
  vendor: